/*
 * Starlink checks. Run on the master/web node (needs icingacli + module + DB
 * resource), never on satellites. If you use Director, create the same
 * CheckCommand there instead (external command, same arguments).
 *
 * The Icinga user (nagios on Debian) must be able to read
 * /etc/icingaweb2/{config.ini,resources.ini,modules/starlink/config.ini}:
 *   usermod -aG icingaweb2 nagios
 */

object CheckCommand "starlink-terminal" {
  command = [ "/usr/bin/icingacli", "starlink", "check", "terminal" ]

  arguments = {
    "--id"               = { value = "$starlink_device_id$"; required = true }
    "--role"             = "$starlink_role$"
    // window = time since the previous check, whatever check_interval is
    "--since"            = "$service.last_check$"
    "--window"           = "$starlink_window$"
    "--active-threshold" = "$starlink_active_threshold$"
    "--active-state"     = "$starlink_active_state$"
    "--online-state"     = "$starlink_online_state$"
    "--offline-after"    = "$starlink_offline_after$"
    "--offline-state"    = "$starlink_offline_state$"
    "--warn-drop"        = "$starlink_warn_drop$"
    "--crit-drop"        = "$starlink_crit_drop$"
    "--warn-latency"     = "$starlink_warn_latency$"
    "--crit-latency"     = "$starlink_crit_latency$"
    "--ignore-alerts"    = "$starlink_ignore_alerts$"
    "--critical-alerts"  = "$starlink_critical_alerts$"
  }

  vars.starlink_role = "failover"
}

object CheckCommand "starlink-health" {
  command = [ "/usr/bin/icingacli", "starlink", "check", "health" ]
}

apply Service "starlink" {
  check_command      = "starlink-terminal"
  check_interval     = 5m
  retry_interval     = 5m
  max_check_attempts = 1   // a failover is a fact, alert on first hit
  vars.starlink_device_id = host.vars.starlink_device_id
  vars.starlink_role      = host.vars.starlink_role
  assign where host.vars.starlink_device_id
}

apply Service "starlink-collector" {
  check_command = "starlink-health"
  check_interval = 1m
  assign where host.name == NodeName
}
